<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Pembelian - Piro Beta</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e599;
            --primary-glow: rgba(0, 229, 153, 0.4);
            --accent: #ffaa00;
            --accent-glow: rgba(255, 170, 0, 0.3);
            --bg-dark: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 85% 15%, rgba(0, 229, 153, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 15% 85%, rgba(255, 170, 0, 0.06) 0%, transparent 40%);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Navbar */
        .navbar {
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #00e599, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .user-status-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
        }

        .container {
            max-width: 520px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        .icon-header {
            width: 65px;
            height: 65px;
            margin: 0 auto 16px;
            background: rgba(0, 229, 153, 0.1);
            border: 1px solid var(--primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .glass-card h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .glass-card p {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Status Badge Box */
        .status-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .status-locked {
            background: rgba(255, 170, 0, 0.12);
            color: var(--accent);
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .status-unlocked {
            background: rgba(0, 229, 153, 0.12);
            color: var(--primary);
            border: 1px solid rgba(0, 229, 153, 0.3);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Form Controls */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #00e599, #00b4d8);
            color: #0b0f19;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--primary-glow);
        }

        .btn-download {
            background: linear-gradient(135deg, #00e599, #00b4d8);
            color: #0b0f19;
            box-shadow: 0 10px 25px var(--primary-glow);
            animation: pulse 2s infinite;
        }

        .btn-download:hover {
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 229, 153, 0.4); }
            70% { box-shadow: 0 0 0 14px rgba(0, 229, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 229, 153, 0); }
        }

        .divider {
            margin: 24px 0;
            border: none;
            border-top: 1px dashed var(--border-color);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">PIRO STORE</div>
        <div class="user-status-badge">
            <span class="user-dot"></span>
            <span id="nav-user-label">Memeriksa akun...</span>
        </div>
    </div>

    <div class="container">
        <div class="glass-card">
            <div class="icon-header">🔑</div>
            <h2>Konfirmasi Pembelian</h2>
            <p>Masukkan ID Pembelian yang kamu peroleh saat melakukan checkout via WhatsApp.</p>

            <!-- Status Box -->
            <div id="status-badge-container">
                <span id="status-badge" class="status-box status-locked">
                    🔒 Status: Terkunci (Rp 15.000)
                </span>
            </div>

            <!-- Form Input ID Pembelian -->
            <div class="form-group" id="input-group">
                <label for="buyer-id">Id pembeli:</label>
                <input type="text" id="buyer-id" class="form-control" placeholder="Contoh: PIRO-84920">
            </div>

            <button id="btn-confirm-action" class="btn btn-confirm" onclick="prosesKonfirmasi()">Konfirmasi</button>

            <!-- Area Tombol Download (Aktif setelah verifikasi) -->
            <div id="download-box" class="hidden">
                <hr class="divider">
                <p style="color: var(--primary); font-weight: 600; margin-bottom: 12px;">
                    ✅ ID Valid! Akses unduhan gratis telah terbuka:
                </p>
                <a href="https://piro-web-apk.vercel.app/" class="btn btn-download" target="_blank">
                    ⬇️ Unduh APK Piro Beta (Gratis)
                </a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem("piro_username");
            const navLabel = document.getElementById("nav-user-label");

            if (savedUsername) {
                navLabel.innerText = "@" + savedUsername;
            } else {
                navLabel.innerText = "Tamu (Belum Ada Akun)";
            }

            // Cek apakah sebelumnya sudah pernah diverifikasi
            if (localStorage.getItem("piro_is_confirmed") === "true") {
                bukaAksesDownload();
            }
        });

        function prosesKonfirmasi() {
            const idVal = document.getElementById("buyer-id").value.trim();

            if (!idVal) {
                alert("Harap masukkan Id pembeli terlebih dahulu!");
                return;
            }

            // Simpan status konfirmasi
            localStorage.setItem("piro_is_confirmed", "true");
            localStorage.setItem("piro_active_id", idVal);

            bukaAksesDownload();
        }

        function bukaAksesDownload() {
            const badge = document.getElementById("status-badge");
            const inputField = document.getElementById("buyer-id");
            const btnConfirm = document.getElementById("btn-confirm-action");
            const downloadBox = document.getElementById("download-box");

            // Ubah Status Badge
            badge.className = "status-box status-unlocked";
            badge.innerHTML = "🔓 Status: Terverifikasi (Gratis)";

            // Kunci input dan sembunyikan tombol submit
            inputField.value = localStorage.getItem("piro_active_id") || inputField.value;
            inputField.disabled = true;
            btnConfirm.style.display = "none";

            // Munculkan Tombol Unduh Gratis
            downloadBox.classList.remove("hidden");
        }
    </script>
</body>
</html>
