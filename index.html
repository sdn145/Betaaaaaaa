<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piro Beta - Premium APK Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e599;
            --primary-glow: rgba(0, 229, 153, 0.4);
            --accent: #ffaa00;
            --bg-dark: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 229, 153, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 170, 0, 0.06) 0%, transparent 40%);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Navbar */
        .navbar {
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #00e599, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .user-status-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
        }

        .user-dot.active {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .container {
            max-width: 680px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* Card Container */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        /* App Banner Area */
        .app-hero {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #00e599, #0077b6);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 800;
            color: #0b0f19;
            box-shadow: 0 10px 25px var(--primary-glow);
            flex-shrink: 0;
        }

        .app-info h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .app-info .dev-label {
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .tag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(0, 229, 153, 0.1);
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 229, 153, 0.2);
            text-transform: uppercase;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-user {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--border-color);
        }

        .btn-user:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-buy {
            background: linear-gradient(135deg, #00e599, #00b4d8);
            color: #0b0f19;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .btn-buy:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--primary-glow);
        }

        /* Description Box */
        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 18px;
            background: var(--primary);
            border-radius: 4px;
            display: inline-block;
        }

        .desc-text {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.7;
        }

        /* Gallery Slider */
        .gallery-container {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: thin;
        }

        .gallery-container::-webkit-scrollbar {
            height: 6px;
        }

        .gallery-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .gallery-item {
            flex: 0 0 160px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #141c2e;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 26px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.25s ease;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1);
        }

        .modal-card h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-card p {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .modal-divider {
            text-align: center;
            margin: 12px 0;
            font-size: 12px;
            color: var(--text-sub);
            position: relative;
        }

        .modal-divider::before, .modal-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: var(--border-color);
        }
        .modal-divider::before { left: 0; }
        .modal-divider::after { right: 0; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="navbar">
        <div class="logo">PIRO STORE</div>
        <div class="user-status-badge">
            <span id="user-indicator" class="user-dot"></span>
            <span id="nav-username">Belum Ada Akun</span>
        </div>
    </div>

    <div class="container">
        <!-- Main App Card -->
        <div class="glass-card">
            <div class="app-hero">
                <div class="app-icon">P</div>
                <div class="app-info">
                    <h1>Piro Beta</h1>
                    <div class="dev-label">Official Marketplace</div>
                    <div class="tag-row">
                        <span class="tag">Beta Tester</span>
                        <span class="tag">Early Access</span>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="btn-group">
                <button class="btn btn-user" onclick="openUsernameModal()">
                    👤 <span id="btn-username-label">Buat Username</span>
                </button>
                <button class="btn btn-buy" onclick="handleBuyClick()">
                    ⚡ Beli APK (15k)
                </button>
            </div>
        </div>

        <!-- Screenshots -->
        <div class="glass-card">
            <div class="section-title">Cuplikan APK Beta</div>
            <div class="gallery-container">
                <div class="gallery-item">
                    <img src="https://cdn.phototourl.com/member/2026-08-31-7c851022-5784-4bdd-9bdd-3dfe2926c3e3.jpg" alt="Preview 1">
                </div>
                <div class="gallery-item">
                    <img src="https://cdn.phototourl.com/member/2026-08-31-f78b7ebf-773c-4562-a597-60c4c26d56ee.jpg" alt="Preview 2">
                </div>
                <div class="gallery-item">
                    <img src="https://cdn.phototourl.com/member/2026-08-31-1f679fd1-e8c6-4708-9245-1d374a12e257.jpg" alt="Preview 3">
                </div>
                <div class="gallery-item">
                    <img src="https://cdn.phototourl.com/member/2026-08-31-e4251c1b-5ab0-4f79-8f8c-1a95f252e172.jpg" alt="Preview 4">
                </div>
            </div>
        </div>

        <!-- Deskripsi -->
        <div class="glass-card">
            <div class="section-title">Deskripsi Aplikasi</div>
            <p class="desc-text">
                piro bera adalah apk marketplace uji coba
            </p>
        </div>
    </div>

    <!-- MODAL POP-UP CREATE USERNAME -->
    <div id="username-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title">Buat Username Anda</h3>
            <p id="modal-desc">Silakan buat username terlebih dahulu sebelum melanjutkan ke transaksi pembelian APK.</p>

            <!-- Opsi 1: Custom Name -->
            <input type="text" id="custom-username-input" class="form-control" placeholder="Ketik custom username Anda...">
            <button class="btn btn-buy" onclick="saveCustomUsername()">Gunakan Custom Name</button>

            <div class="modal-divider">ATAU</div>

            <!-- Opsi 2: Auto / Random -->
            <button class="btn btn-user" onclick="generateAutoUsername()">🎲 Generate Auto Username</button>
        </div>
    </div>

    <script>
        const OWNER_WA = "6283161621493";

        // Cek username saat pertama dibuka
        window.addEventListener('DOMContentLoaded', () => {
            updateUserDisplay();
        });

        function updateUserDisplay() {
            const savedUser = localStorage.getItem("piro_username");
            const navLabel = document.getElementById("nav-username");
            const btnLabel = document.getElementById("btn-username-label");
            const indicator = document.getElementById("user-indicator");

            if (savedUser) {
                navLabel.innerText = "@" + savedUser;
                btnLabel.innerText = "Ganti Username";
                indicator.classList.add("active");
            } else {
                navLabel.innerText = "Belum Ada Akun";
                btnLabel.innerText = "Buat Username";
                indicator.classList.remove("active");
            }
        }

        function openUsernameModal(warning = false) {
            const modal = document.getElementById("username-modal");
            const title = document.getElementById("modal-title");
            const desc = document.getElementById("modal-desc");

            if (warning) {
                title.innerText = "Kamu belum punya username!";
                title.style.color = "#ffaa00";
                desc.innerText = "Harap buat username terlebih dahulu dengan memilih Custom Name atau Auto Username.";
            } else {
                title.innerText = "Pengaturan Username";
                title.style.color = "#ffffff";
                desc.innerText = "Tentukan username yang akan digunakan untuk verifikasi ID dan klaim VIP.";
            }

            modal.classList.add("show");
        }

        function closeUsernameModal() {
            document.getElementById("username-modal").classList.remove("show");
        }

        function saveCustomUsername() {
            const inputVal = document.getElementById("custom-username-input").value.trim();
            if (!inputVal) {
                alert("Harap masukkan nama username Anda!");
                return;
            }
            localStorage.setItem("piro_username", inputVal);
            updateUserDisplay();
            closeUsernameModal();
            alert("Username berhasil dibuat: @" + inputVal);
        }

        function generateAutoUsername() {
            const adjectives = ["Gamer", "Cyber", "Pro", "Ultra", "Elite", "Master"];
            const randomAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            const autoUser = `${randomAdj}_${randomNum}`;

            localStorage.setItem("piro_username", autoUser);
            updateUserDisplay();
            closeUsernameModal();
            alert("Auto Username berhasil dibuat: @" + autoUser);
        }

        function handleBuyClick() {
            const currentUser = localStorage.getItem("piro_username");

            // Jika belum punya username, munculkan pop up peringatan
            if (!currentUser) {
                openUsernameModal(true);
                return;
            }

            // Generate Random Purchase ID
            const randomId = "PIRO-" + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem("latest_purchase_id", randomId);

            // Format Pesan WhatsApp
            const message = `Halo Developer/Owner, saya ingin membeli APK Piro Beta.\n\n` +
                            `• Username: @${currentUser}\n` +
                            `• Harga: Rp 15.000\n` +
                            `• ID Pembelian: ${randomId}\n\n` +
                            `Mohon diproses, terima kasih!`;

            const waUrl = `https://wa.me/${OWNER_WA}?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
